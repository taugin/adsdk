// This is a dependency file for a third-party advertising platform

def ADMOB = 'admob'
def TRADPLUS = 'tradplus'
def APPLOVIN = 'applovin'
def FACEBOOK = 'facebook'
def MINTEGRAL = 'mintegral'
def INMOBI = 'inmobi'
def UNITY = 'unity'
def VUNGLE = 'vungle'
def IRONSOURCE = 'ironsource'
def BIGO = 'bigo'

def all_platform_list = [ADMOB, TRADPLUS, APPLOVIN, FACEBOOK, MINTEGRAL, INMOBI, UNITY, VUNGLE, IRONSOURCE, BIGO]

def include_platform_list = all_platform_list
if (ext.has('network')) {
    def custom_include_platform_list = ext.get('network')
    if (custom_include_platform_list != null && !custom_include_platform_list.isEmpty()) {
        include_platform_list = custom_include_platform_list
    } else {
        include_platform_list = all_platform_list
    }
}

def isContains(platform_list, platform) {
    return platform_list != null && platform_list.contains(platform)
}

dependencies {
    implementation 'androidx.percentlayout:percentlayout:1.0.0'
    // firebase
    implementation 'com.google.firebase:firebase-config:21.1.1'
    // stringfog
    implementation 'com.github.megatronking.stringfog:xor:4.0.1'
    // install referrer
    implementation 'com.android.installreferrer:installreferrer:1.0'
//////////////////////////////////////////////////////////////////////////////////////////

    if (isContains(include_platform_list, TRADPLUS)) {
        // tradplus
        implementation 'androidx.legacy:legacy-support-v4:1.0.0'
        implementation 'androidx.appcompat:appcompat:1.3.0-alpha02'
        //TradPlus
        implementation 'com.tradplusad:tradplus:13.8.0.1'
        // Adx
        implementation 'com.tradplusad:tp_exchange:40.13.8.0.1'
        implementation 'com.google.code.gson:gson:2.8.6'
        // Cross Promotion
        implementation 'com.tradplusad:tradplus-crosspromotion:27.13.8.0.1'
    }

//////////////////////////////////////////////////////////////////////////////////////////

    if (isContains(include_platform_list, APPLOVIN)) {
        // applovin
        implementation 'com.applovin:applovin-sdk:13.2.0'
        if (isContains(include_platform_list, TRADPLUS)) {
            // tradplus applovin mediation
            implementation 'com.tradplusad:tradplus-applovin:9.13.8.0.1'
        }
        if (isContains(include_platform_list, ADMOB)) {
            // google applovin mediation
            implementation 'com.google.ads.mediation:applovin:13.2.0.1@aar'
        }
    }
//////////////////////////////////////////////////////////////////////////////////////////

    if (isContains(include_platform_list, ADMOB)) {
        // admob
        implementation 'com.google.android.gms:play-services-ads:24.1.0'
        if (isContains(include_platform_list, APPLOVIN)) {
            // admob applovin mediation
            implementation 'com.applovin.mediation:google-adapter:24.1.0.0@aar'
            // admanager applovin mediation
            implementation 'com.applovin.mediation:google-ad-manager-adapter:24.1.0.0@aar'
        }
        if (isContains(include_platform_list, TRADPLUS)) {
            // tradplus mediation
            implementation 'com.tradplusad:tradplus-googlex:2.13.8.0.1'
        }
    }
//////////////////////////////////////////////////////////////////////////////////////////

    if (isContains(include_platform_list, FACEBOOK)) {
        // facebook
        implementation 'com.facebook.android:audience-network-sdk:6.19.0'
        if (isContains(include_platform_list, APPLOVIN)) {
            // applovin facebook mediation
            implementation 'com.applovin.mediation:facebook-adapter:6.19.0.2@aar'
        }
        if (isContains(include_platform_list, TRADPLUS)) {
            // tradplus facebook mediation
            implementation 'com.tradplusad:tradplus-facebook:1.13.8.0.1'
        }
        if (isContains(include_platform_list, ADMOB)) {
            // google facebook mediation
            implementation 'com.google.ads.mediation:facebook:6.19.0.1@aar'
        }
    }
//////////////////////////////////////////////////////////////////////////////////////////

    if (isContains(include_platform_list, MINTEGRAL)) {
        // mintegral
        implementation "com.mbridge.msdk.oversea:mbridge_android_sdk:16.9.61"
        if (isContains(include_platform_list, APPLOVIN)) {
            // applovin mintegral mediation
            implementation 'com.applovin.mediation:mintegral-adapter:16.9.61.0@aar'
        }
        if (isContains(include_platform_list, TRADPLUS)) {
            // tradplus mintegral mediation
            implementation 'com.tradplusad:tradplus-mintegralx_overseas:18.13.8.0.1'
        }
        if (isContains(include_platform_list, ADMOB)) {
            // google mintegral mediation
            implementation 'com.google.ads.mediation:mintegral:16.9.51.0@aar'
        }
    }
//////////////////////////////////////////////////////////////////////////////////////////

    if (isContains(include_platform_list, INMOBI)) {
        // Inmobi
        implementation 'com.inmobi.monetization:inmobi-ads-kotlin:10.8.2'
        if (isContains(include_platform_list, APPLOVIN)) {
            // applovin inmobi mediation
            implementation 'com.applovin.mediation:inmobi-adapter:10.8.2.0@aar'
        }
        if (isContains(include_platform_list, TRADPLUS)) {
            //tradplus inmobi mediation
            implementation 'com.tradplusad:tradplus-inmobix:23.13.8.0.1'
        }
        if (isContains(include_platform_list, ADMOB)) {
            // google inmobi mediation
            implementation 'com.google.ads.mediation:inmobi:10.8.2.0@aar'
        }
    }
//////////////////////////////////////////////////////////////////////////////////////////

    if (isContains(include_platform_list, UNITY)) {
        // unity
        implementation 'com.unity3d.ads:unity-ads:4.14.1'
        if (isContains(include_platform_list, APPLOVIN)) {
            // unity applovin mediation
            implementation 'com.applovin.mediation:unityads-adapter:4.14.1.0@aar'
        }
        if (isContains(include_platform_list, TRADPLUS)) {
            // tradplus unity mediation
            implementation 'com.tradplusad:tradplus-unity:5.13.8.0.1'
        }
        if (isContains(include_platform_list, ADMOB)) {
            // google unity mediation
            implementation 'com.google.ads.mediation:unity:4.14.1.0@aar'
        }
    }
//////////////////////////////////////////////////////////////////////////////////////////

    if (isContains(include_platform_list, VUNGLE)) {
        // vungle
        implementation 'com.vungle:vungle-ads:7.4.3'
        if (isContains(include_platform_list, APPLOVIN)) {
            // applovin vungle mediation
            implementation 'com.applovin.mediation:vungle-adapter:7.4.3.1'
        }
        if (isContains(include_platform_list, TRADPLUS)) {
            // tradplus vungle mediation
            implementation 'com.tradplusad:tradplus-vunglex:7.13.8.0.1'
        }
        if (isContains(include_platform_list, ADMOB)) {
            // google vungle medation
            implementation 'com.google.ads.mediation:vungle:7.4.3.0@aar'
        }
    }
//////////////////////////////////////////////////////////////////////////////////////////

    if (isContains(include_platform_list, IRONSOURCE)) {
        // ironSource
        implementation 'com.ironsource.sdk:mediationsdk:8.7.0'
        if (isContains(include_platform_list, APPLOVIN)) {
            // Vungle applovin mediation
            implementation 'com.applovin.mediation:ironsource-adapter:8.7.0.0.0@aar'
        }
        if (isContains(include_platform_list, TRADPLUS)) {
            // tradplus mediation
            implementation 'com.tradplusad:tradplus-ironsource:10.13.8.0.1'
        }
        if (isContains(include_platform_list, ADMOB)) {
            // google ironsource mediation
            implementation 'com.google.ads.mediation:ironsource:8.7.0.0@aar'
        }
    }
//////////////////////////////////////////////////////////////////////////////////////////

    if (isContains(include_platform_list, BIGO)) {
        // Bigo
        implementation 'com.bigossp:bigo-ads:5.2.1'
        if (isContains(include_platform_list, APPLOVIN)) {
            // applovin Bigo mediation
            implementation 'com.applovin.mediation:bigoads-adapter:5.2.1.0'
        }
        if (isContains(include_platform_list, TRADPLUS)) {
            // tradplus Bigo mediation
            implementation 'com.tradplusad:tradplus-bigo:57.13.8.0.1'
        }
        if (isContains(include_platform_list, ADMOB)) {
            // google bigo mediation
            implementation 'com.bigossp:admob-mediation:5.2.1.0@aar'
        }
    }
}